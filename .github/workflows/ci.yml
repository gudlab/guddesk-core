name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install
        run: pnpm install --ignore-scripts
      - name: Test
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.txt
          count=$(grep -E '^# tests ' test-output.txt | tail -1 | awk '{print $3}')
          if [ -z "$count" ] || [ "$count" -eq 0 ]; then
            echo "FAIL: CI ran zero tests (count=${count:-missing})"
            exit 1
          fi
          echo "Ran $count tests"
