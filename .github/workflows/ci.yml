name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/guddesk?sslmode=disable
      AUTH_SECRET: ci-auth-secret-not-used
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      RESEND_API_KEY: re_ci_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Validate GudBot AI eval set
        run: node qa/ai-eval/score.mjs validate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm prisma generate
      - name: Typecheck
        run: pnpm run build:content && pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Test
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.txt
          count=$(grep -E '^# tests ' test-output.txt | tail -1 | awk '{print $3}')
          if [ -z "$count" ] || [ "$count" -eq 0 ]; then
            echo "FAIL: CI ran zero tests (count=${count:-missing})"
            exit 1
          fi
          echo "Ran $count tests"
      - name: Build
        run: pnpm build
