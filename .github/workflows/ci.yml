name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  AUTH_SECRET: ci-placeholder-auth-secret-value
  GOOGLE_CLIENT_ID: ci-google-client-id
  GOOGLE_CLIENT_SECRET: ci-google-client-secret
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/guddesk
  RESEND_API_KEY: re_ci_placeholder

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install
        run: pnpm install
      - name: Prisma generate
        run: pnpm exec prisma generate
      - name: Test
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.txt
          count=$(grep -E '^# tests ' test-output.txt | tail -1 | awk '{print $3}')
          if [ -z "$count" ] || [ "$count" -eq 0 ]; then
            echo "FAIL: CI ran zero tests (count=${count:-missing})"
            exit 1
          fi
          echo "Ran $count tests"
      - name: Build content
        run: pnpm build:content
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

  migrations:
    name: Migrations (empty Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway service container; nothing here reaches a real database.
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install
        run: pnpm install
      - name: Prisma generate
        run: pnpm exec prisma generate
      - name: prisma migrate deploy on an empty database (no drift, smoke), then upgrade one with data
        run: bash scripts/ci-migrate-check.sh
