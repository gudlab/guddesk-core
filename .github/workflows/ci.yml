# Required GitHub branch protection checks (Kim / repo admin; Eng cannot set these):
#   - fast-gate
#   - Migrations (empty Postgres)
# Do not require full-build. It still runs on pull_request and main so failures show.
# Soft-launch HOLD. GudBot stays default OFF. No live AI eval in CI.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  AUTH_SECRET: ci-placeholder-auth-secret-value
  GOOGLE_CLIENT_ID: ci-google-client-id
  GOOGLE_CLIENT_SECRET: ci-google-client-secret
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/guddesk
  RESEND_API_KEY: re_ci_placeholder

jobs:
  fast-gate:
    name: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate GudBot AI eval set
        run: node qa/ai-eval/score.mjs validate
      - name: Fast checks
        run: node scripts/ci-fast-checks.mjs
      - name: Prisma generate
        run: pnpm exec prisma generate
      - name: Test
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.txt
          count=$(grep -E '^# tests ' test-output.txt | tail -1 | awk '{print $3}')
          if [ -z "$count" ] || [ "$count" -eq 0 ]; then
            echo "FAIL: CI ran zero tests (count=${count:-missing})"
            exit 1
          fi
          echo "Ran $count tests"
      # tsc imports contentlayer/generated. This is not the Next build.
      - name: Build content
        run: pnpm build:content
      - name: Typecheck
        run: pnpm exec tsc --noEmit

  migrations:
    name: Migrations (empty Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway service container; nothing here reaches a real database.
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm exec prisma generate
      - name: prisma migrate deploy on an empty database (no drift, smoke), then upgrade one with data
        run: bash scripts/ci-migrate-check.sh

  full-build:
    name: full-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm exec prisma generate
      - name: Build content
        run: pnpm build:content
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
